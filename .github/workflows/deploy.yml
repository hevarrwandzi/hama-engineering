name: Deploy Hama Engineering to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          # The bucket name will be generated by Terraform, we will need to update this after apply
          aws s3 sync . s3://hama-engineering-2026-1774367721 --delete --exclude ".git*" --exclude ".github*" --exclude "terraform*"

      - name: Invalidate CloudFront Cache
        run: |
          # Distribution ID will be generated by Terraform
          # aws cloudfront create-invalidation --distribution-id YOUR_ID --paths "/*"
