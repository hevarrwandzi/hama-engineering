<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Portal — Dr. Dilshad ECB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-heading: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color-scheme: dark;
      
      --bg: #040711;
      --card-bg: rgba(13, 21, 37, 0.94);
      --text: #f0f4fc;
      --muted: #8496b0;
      
      --accent: #ff6b00;
      --accent-glow: rgba(255, 107, 0, 0.35);
      --accent-light: #ff9233;
      
      --border: rgba(255, 255, 255, 0.1);
      --border-accent: rgba(255, 107, 0, 0.35);
      --shadow-lg: 0 32px 80px rgba(0, 0, 0, 0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(255,107,0,0.15) 0%, rgba(10,17,32,0.95) 45%, #040711 100%);
      color: var(--text);
      font-family: var(--font-body);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-accent);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 2;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-header h1 {
      font-family: var(--font-heading);
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-header p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    form { display: flex; flex-direction: column; gap: 16px; }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    input {
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      background: rgba(255,255,255,0.04);
      color: #fff;
      outline: none;
      transition: all 0.25s ease;
      font-family: var(--font-body);
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
      background: rgba(255,255,255,0.07);
    }
    button[type="submit"] {
      margin-top: 8px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #000;
      padding: 15px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      font-size: 1.05rem;
      font-family: var(--font-heading);
      transition: all 0.25s ease;
      box-shadow: 0 12px 30px var(--accent-glow);
    }
    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px var(--accent-glow);
      filter: brightness(1.06);
    }
    .message {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .message.error {
      display: block;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #f43f5e;
    }
    .message.success {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }
    .quick-login-wrap {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .quick-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 14px;
    }
    .quick-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-quick {
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .btn-quick span {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
    }
    .btn-quick:hover {
      border-color: var(--accent);
      background: rgba(255,107,0,0.12);
      color: var(--accent-light);
      transform: translateY(-2px);
    }
    .footer-nav {
      margin-top: 24px;
      text-align: center;
    }
    .footer-nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    .footer-nav a:hover {
      color: var(--accent-light);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-header">
      <h1>Secure Portal</h1>
      <p>Sign in to access the Enterprise Video Gallery or Admin Console.</p>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. admin or member" required autocomplete="username" />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit">Sign In ➔</button>
    </form>

    <div id="message" class="message"></div>

    <div class="quick-login-wrap">
      <div class="quick-title">⚡ Quick Access Buttons</div>
      <div class="quick-btns">
        <button type="button" class="btn-quick" onclick="quickLogin('admin', 'admin123')">
          🔑 Admin Mode
          <span>admin / admin123</span>
        </button>
        <button type="button" class="btn-quick" onclick="quickLogin('member', 'member123')">
          🎬 Member Mode
          <span>member / member123</span>
        </button>
      </div>
    </div>
  </div>

  <div class="footer-nav">
    <a href="index.html">⬅ Back to Home Page</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    function setMessage(text, type) {
      message.className = 'message ' + (type || '');
      message.textContent = text;
    }

    async function executeLogin(username, password) {
      const cleanUsername = username.trim().toLowerCase();
      const cleanPassword = password.trim();

      setMessage('Authenticating...', '');

      // Try Backend API if available
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: cleanUsername, password: cleanPassword })
        });

        if (response.ok) {
          const result = await response.json();
          if (result.role === 'member') {
            localStorage.setItem('memberAuth', 'true');
            setMessage('Login successful! Redirecting to Member Gallery...', 'success');
            setTimeout(() => { window.location.href = 'member.html'; }, 400);
          } else {
            localStorage.setItem('adminAuth', 'true');
            setMessage('Login successful! Redirecting to Admin Console...', 'success');
            setTimeout(() => { window.location.href = 'admin.html'; }, 400);
          }
          return;
        }
      } catch (err) {
        console.log('[Static Auth Fallback Mode]');
      }

      // Static / S3 / GitHub Pages Fallback
      if (cleanUsername === 'admin' && cleanPassword === 'admin123') {
        localStorage.setItem('adminAuth', 'true');
        setMessage('Login successful! Redirecting to Admin Console...', 'success');
        setTimeout(() => { window.location.href = 'admin.html'; }, 400);
      } else if (cleanUsername === 'member' && cleanPassword === 'member123') {
        localStorage.setItem('memberAuth', 'true');
        setMessage('Login successful! Redirecting to Member Gallery...', 'success');
        setTimeout(() => { window.location.href = 'member.html'; }, 400);
      } else {
        setMessage('Invalid username or password. Please use admin / admin123 or member / member123.', 'error');
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      executeLogin(username, password);
    });

    function quickLogin(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
      executeLogin(user, pass);
    }
  </script>
</body>
</html>
