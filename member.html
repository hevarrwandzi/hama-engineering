<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Video Gallery</title>
  <style>
    :root {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color-scheme: dark;
      --bg: #09101d;
      --surface: #111d33;
      --card: rgba(17, 29, 47, 0.96);
      --text: #e8eff7;
      --muted: #94a6c1;
      --accent: #e87c2a;
      --accent-soft: rgba(232,124,42,0.16);
      --border: rgba(255,255,255,0.1);
      --shadow: 0 28px 80px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(232,124,42,0.12), transparent 20%), linear-gradient(180deg, #08101f 0%, #05101c 100%);
      color: var(--text);
      font-family: var(--font-family);
      padding: 24px;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    .topbar p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 620px;
      line-height: 1.75;
    }
    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.25s ease, filter 0.25s ease;
      text-decoration: none;
    }
    .button.primary {
      background: linear-gradient(135deg, var(--accent), #f2a659);
      color: #111;
    }
    .button.secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .button:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 0;
      background: rgba(255,255,255,0.04);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .video-card {
      overflow: hidden;
      border-radius: 20px;
      background: #0d1a2f;
      border: 1px solid rgba(255,255,255,0.08);
    }
    video {
      width: 100%;
      display: block;
      border-radius: 20px 20px 0 0;
      background: #000;
    }
    .card-title {
      padding: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      background: rgba(255,255,255,0.04);
    }
    .empty {
      padding: 32px;
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      margin-top: 24px;
      background: rgba(255,255,255,0.03);
    }
    @media (max-width: 680px) {
      .topbar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Member Video Gallery</h1>
        <p>Only signed-in members can watch these uploaded videos. Access the latest uploaded content here.</p>
      </div>
      <div class="button-row">
        <a href="/" class="button secondary">Home</a>
        <a href="login.html" class="button primary">Log Out</a>
      </div>
    </div>
    <div id="videos"></div>
  </div>

  <script>
    async function loadVideos() {
      const container = document.getElementById('videos');
      container.innerHTML = '<div class="empty">Loading video gallery...</div>';

      try {
        const response = await fetch('/api/member-videos');
        if (response.ok) {
          const data = await response.json();
          if (data.ok && data.videos && data.videos.length > 0) {
            renderVideos(data.videos);
            return;
          }
        }
      } catch (e) {
        console.log('[S3 Direct Video Listing Mode]');
      }

      // Fallback: Query S3 video bucket directly (XML endpoint)
      try {
        const s3BucketUrl = 'https://hama-engineering-videos.s3.eu-north-1.amazonaws.com';
        const s3Res = await fetch(`${s3BucketUrl}?list-type=2`);
        if (s3Res.ok) {
          const xmlText = await s3Res.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
          const contents = xmlDoc.getElementsByTagName('Contents');
          const s3Videos = [];

          for (let i = 0; i < contents.length; i++) {
            const key = contents[i].getElementsByTagName('Key')[0]?.textContent || '';
            const size = parseInt(contents[i].getElementsByTagName('Size')[0]?.textContent || '0');
            const lowerKey = key.toLowerCase();
            if (size > 0 && (lowerKey.endsWith('.mp4') || lowerKey.endsWith('.webm') || lowerKey.endsWith('.mov') || lowerKey.endsWith('.m4v') || lowerKey.endsWith('.avi'))) {
              const name = key.replace(/^videos\//, '');
              const formattedSize = (size / (1024 * 1024)).toFixed(1) + ' MB';
              s3Videos.push({ name, url: `${s3BucketUrl}/${key}`, size: formattedSize });
            }
          }

          if (s3Videos.length > 0) {
            renderVideos(s3Videos);
            return;
          }
        }
      } catch (err) {
        console.error('S3 Direct fetch error:', err);
      }

      container.innerHTML = '<div class="empty">No videos uploaded yet. Admin can upload videos from the Admin Dashboard.</div>';
    }

    function renderVideos(videos) {
      const container = document.getElementById('videos');
      container.innerHTML = '<div class="grid">' + videos.map(video => {
        const isMov = video.url.toLowerCase().endsWith('.mov');
        const mimeType = isMov ? 'video/quicktime' : 'video/mp4';
        return `
          <div class="card">
            <video controls preload="metadata" style="background:#000; width:100%; max-height: 280px; border-radius: 16px 16px 0 0;">
              <source src="${video.url}" type="${mimeType}">
              <source src="${video.url}">
              Your browser does not support playing this video format inline.
            </video>
            <div style="padding: 16px;">
              <p class="card-title" style="margin:0 0 10px; font-weight:700; word-break:break-all;">${video.name}</p>
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                <span style="font-size:0.85rem; color:var(--muted);">${video.size || ''}</span>
                <a href="${video.url}" target="_blank" download class="button primary" style="padding:6px 14px; font-size:0.85rem;">Play / Open Video ↗</a>
              </div>
            </div>
          </div>
        `;
      }).join('') + '</div>';
    }

    loadVideos();
  </script>
</body>
</html>
