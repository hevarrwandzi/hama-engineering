<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Submissions Admin</title>
  <style>
    :root {
      --font-family: 'Inter', Arial, Helvetica, sans-serif;
      color-scheme: dark;
      --bg: #08101b;
      --card: rgba(13, 21, 35, 0.96);
      --surface: #0f1c32;
      --text: #e8eef7;
      --muted: #90a6c2;
      --accent: #e87c2a;
      --accent-dark: #c96a1f;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 30px 80px rgba(0,0,0,0.32);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(232,124,42,0.14), transparent 25%), linear-gradient(180deg, #09111d 0%, #05101a 100%);
      color: var(--text);
      padding: 24px;
      font-family: var(--font-family);
    }
    .wrap {
      max-width: 1140px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .header {
      padding: 32px 36px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.03);
    }
    .header h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
    .header p { margin: 8px 0 0; color: var(--muted); max-width: 620px; line-height: 1.75; }
    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    .button.primary { background: linear-gradient(135deg, var(--accent), #f2a659); color: #111; }
    .button.secondary { background: rgba(255,255,255,0.08); color: var(--text); }
    .button:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .content { padding: 32px 36px 36px; }
    .panel {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 24px;
      background: rgba(255,255,255,0.03);
    }
    .status { margin-bottom: 18px; color: var(--muted); }
    .upload-form {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .upload-form input[type="file"] {
      flex: 1;
      min-width: 240px;
      border: 1px dashed rgba(255,255,255,0.16);
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      color: var(--text);
    }
    th, td {
      text-align: left;
      padding: 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: top;
    }
    th { background: rgba(255,255,255,0.04); color: #eef3ff; font-weight: 700; }
    td { background: rgba(255,255,255,0.02); }
    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(255,255,255,0.14);
      border-radius: 18px;
      background: rgba(255,255,255,0.03);
    }
    .meta { color: var(--muted); font-size: 0.88rem; }
    @media (max-width: 760px) {
      .upload-form { flex-direction: column; align-items: stretch; }
      .header { padding: 28px 24px; }
      .content { padding: 28px 24px 28px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>Admin Dashboard</h1>
        <p>Upload videos and review contact submissions from your website visitors.</p>
      </div>
      <div class="header-actions">
        <a href="/" class="button secondary">Back to Home</a>
        <button id="refreshBtn" class="button primary" type="button">Refresh Submissions</button>
      </div>
    </div>
    <div class="content">
      <div class="panel">
        <h3 style="margin:0 0 10px;">Upload a Video</h3>
        <form id="uploadForm" class="upload-form">
          <input type="file" id="videoFile" name="video" accept="video/*" required />
          <button type="submit">Upload Video</button>
        </form>
        <div id="uploadStatus" class="status" style="margin-top:10px;">Choose a video to upload.</div>
      </div>
      <div id="status" class="status">Loading submissions...</div>
      <div id="tableWrap"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const tableWrap = document.getElementById('tableWrap');
    const refreshBtn = document.getElementById('refreshBtn');
    const uploadForm = document.getElementById('uploadForm');
    const uploadStatus = document.getElementById('uploadStatus');

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function loadSubmissions() {
      statusEl.textContent = 'Loading submissions...';
      try {
        const response = await fetch('/api/submissions');
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error('Unable to load submissions.');

        if (!data.submissions || data.submissions.length === 0) {
          tableWrap.innerHTML = '<div class="empty">No submissions yet.</div>';
          statusEl.textContent = 'No submissions received.';
          return;
        }

        const rows = data.submissions.map((item) => `
          <tr>
            <td>${escapeHtml(item.name || '')}</td>
            <td>${escapeHtml(item.email || '')}</td>
            <td>${escapeHtml(item.message || '')}</td>
            <td><div>${escapeHtml(item.createdAt || '')}</div><div class="meta">ID: ${escapeHtml(item.id || '')}</div></td>
          </tr>
        `).join('');

        tableWrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Message</th>
                <th>Received</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
        statusEl.textContent = `${data.submissions.length} submission(s) loaded.`;
      } catch (error) {
        tableWrap.innerHTML = '';
        statusEl.textContent = error.message || 'Unable to load submissions.';
      }
    }

    uploadForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];

      if (!file) {
        uploadStatus.textContent = 'Please choose a video file.';
        return;
      }

      uploadStatus.textContent = 'Preparing upload...';

      try {
        // Step 1: Check if S3 Presigned URL mode is enabled
        const presignRes = await fetch('/api/get-upload-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fileName: file.name, fileType: file.type })
        });
        const presignData = await presignRes.json();

        if (presignData.ok && presignData.s3Mode) {
          // Direct S3 Upload via Presigned Post
          uploadStatus.textContent = 'Uploading directly to AWS S3... (0%)';
          
          const s3FormData = new FormData();
          Object.entries(presignData.fields).forEach(([key, value]) => {
            s3FormData.append(key, value);
          });
          s3FormData.append('file', file);

          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', presignData.url);
            xhr.upload.onprogress = (e) => {
              if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                uploadStatus.textContent = `Uploading to AWS S3... (${percent}%)`;
              }
            };
            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve();
              } else {
                reject(new Error(`S3 upload failed with status ${xhr.status}`));
              }
            };
            xhr.onerror = () => reject(new Error('Network error during S3 upload'));
            xhr.send(s3FormData);
          });

          uploadStatus.textContent = '🎉 Video uploaded successfully to AWS S3!';
          fileInput.value = '';
          return;
        }

        // Step 2: Fallback to local server upload if S3 is not configured
        uploadStatus.textContent = 'Uploading to server...';
        const formData = new FormData();
        formData.append('video', file);

        const response = await fetch('/api/upload-video', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Upload failed.');
        uploadStatus.textContent = result.message || 'Video uploaded successfully to server.';
        fileInput.value = '';
      } catch (error) {
        uploadStatus.textContent = error.message || 'Upload failed.';
      }
    });

    refreshBtn.addEventListener('click', loadSubmissions);
    loadSubmissions();
  </script>
</body>
</html>
