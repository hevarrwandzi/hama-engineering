<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Cinema Gallery — Hama Engineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-heading: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color-scheme: dark;
      
      --bg: #050811;
      --card-bg: rgba(13, 22, 40, 0.75);
      --surface: #0b1426;
      --text: #f0f4fc;
      --text-muted: #889bb8;
      
      --accent: #ff6b00;
      --accent-glow: rgba(255, 107, 0, 0.35);
      --accent-light: #ff9233;
      
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(255, 107, 0, 0.35);
      --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    body::before {
      content: '';
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 60px;
      position: relative;
      z-index: 1;
    }

    /* Top Nav */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 20px 28px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-lg);
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .brand-title { font-family: var(--font-heading); font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-subtitle { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: #050811; box-shadow: 0 6px 20px var(--accent-glow); }
    .btn-glass { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

    /* Search & Filter Bar */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 14px 20px 14px 46px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    /* Video Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 28px;
    }

    .video-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
    }
    .video-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-6px);
      box-shadow: 0 24px 48px -12px rgba(255, 107, 0, 0.2);
    }

    .player-wrap {
      width: 100%;
      height: 210px;
      background: #000;
      position: relative;
    }
    .player-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hd-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent);
      border: 1px solid rgba(255,107,0,0.3);
    }

    .card-body {
      padding: 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .card-title {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-all;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .size-pill {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: 24px;
      background: var(--card-bg);
    }
  </style>
</head>
<body>

  <div class="wrap">
    <!-- Top Navigation -->
    <nav class="top-nav">
      <div class="brand">
        <div class="brand-icon">🎬</div>
        <div>
          <div class="brand-title">Member Cinema Gallery</div>
          <div class="brand-subtitle">Hama Engineering Internal Media</div>
        </div>
      </div>
      <div class="nav-actions">
        <a href="/" class="btn btn-glass">🌐 Home</a>
        <a href="login.html" class="btn btn-glass" onclick="localStorage.clear()">🔒 Log Out</a>
      </div>
    </nav>

    <!-- Search & Filter Bar -->
    <div class="filter-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search company video gallery by title..." />
      </div>
    </div>

    <!-- Video Grid Container -->
    <div id="videoContainer">
      <div class="empty-state">Loading video gallery from AWS S3...</div>
    </div>
  </div>

  <script>
    let allVideos = [];

    async function loadVideos() {
      const container = document.getElementById('videoContainer');
      container.innerHTML = '<div class="empty-state">Fetching company video assets...</div>';

      try {
        const response = await fetch('/api/member-videos');
        if (response.ok) {
          const data = await response.json();
          if (data.ok && data.videos && data.videos.length > 0) {
            allVideos = data.videos;
            renderVideos(allVideos);
            return;
          }
        }
      } catch (e) {}

      // Direct S3 XML fallback
      try {
        const s3BucketUrl = 'https://hama-engineering-videos.s3.eu-north-1.amazonaws.com';
        const s3Res = await fetch(`${s3BucketUrl}?list-type=2`);
        if (s3Res.ok) {
          const xmlText = await s3Res.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
          const contents = xmlDoc.getElementsByTagName('Contents');
          const s3Videos = [];

          for (let i = 0; i < contents.length; i++) {
            const key = contents[i].getElementsByTagName('Key')[0]?.textContent || '';
            const size = parseInt(contents[i].getElementsByTagName('Size')[0]?.textContent || '0');
            const lowerKey = key.toLowerCase();

            if (size > 0 && (lowerKey.endsWith('.mp4') || lowerKey.endsWith('.webm') || lowerKey.endsWith('.mov') || lowerKey.endsWith('.m4v') || lowerKey.endsWith('.avi'))) {
              const name = key.replace(/^videos\//, '');
              let sizeStr = (size / (1024 * 1024)).toFixed(1) + ' MB';
              if (size > 1024 * 1024 * 1024) {
                sizeStr = (size / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
              }
              s3Videos.push({ name, url: `${s3BucketUrl}/${key}`, size: sizeStr });
            }
          }

          if (s3Videos.length > 0) {
            allVideos = s3Videos;
            renderVideos(allVideos);
            return;
          }
        }
      } catch (err) {
        console.error('S3 Direct fetch error:', err);
      }

      container.innerHTML = '<div class="empty-state">No videos uploaded yet. The Admin can upload videos from the Admin Command Console.</div>';
    }

    function renderVideos(videos) {
      const container = document.getElementById('videoContainer');

      if (!videos || videos.length === 0) {
        container.innerHTML = '<div class="empty-state">No matching videos found.</div>';
        return;
      }

      const gridHtml = '<div class="grid">' + videos.map(video => {
        const isMov = video.url.toLowerCase().endsWith('.mov');
        const mimeType = isMov ? 'video/quicktime' : 'video/mp4';

        return `
          <div class="video-card">
            <div class="player-wrap">
              <span class="hd-badge">4K / HD</span>
              <video controls preload="metadata">
                <source src="${video.url}" type="${mimeType}">
                <source src="${video.url}">
              </video>
            </div>
            <div class="card-body">
              <div class="card-title">${video.name}</div>
              <div class="card-footer">
                <span class="size-pill">📦 ${video.size || 'HD Video'}</span>
                <a href="${video.url}" target="_blank" download class="btn btn-primary" style="padding:6px 14px; font-size:0.8rem;">Play / Open Video ↗</a>
              </div>
            </div>
          </div>
        `;
      }).join('') + '</div>';

      container.innerHTML = gridHtml;
    }

    // Search input listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = allVideos.filter(v => v.name.toLowerCase().includes(query));
      renderVideos(filtered);
    });

    // Initial load
    loadVideos();
  </script>
</body>
</html>
