<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Video Gallery</title>
  <style>
    :root {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color-scheme: dark;
      --bg: #09101d;
      --surface: #111d33;
      --card: rgba(17, 29, 47, 0.96);
      --text: #e8eff7;
      --muted: #94a6c1;
      --accent: #e87c2a;
      --accent-soft: rgba(232,124,42,0.16);
      --border: rgba(255,255,255,0.1);
      --shadow: 0 28px 80px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(232,124,42,0.12), transparent 20%), linear-gradient(180deg, #08101f 0%, #05101c 100%);
      color: var(--text);
      font-family: var(--font-family);
      padding: 24px;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    .topbar p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 620px;
      line-height: 1.75;
    }
    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.25s ease, filter 0.25s ease;
      text-decoration: none;
    }
    .button.primary {
      background: linear-gradient(135deg, var(--accent), #f2a659);
      color: #111;
    }
    .button.secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .button:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 0;
      background: rgba(255,255,255,0.04);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }
    .video-card {
      overflow: hidden;
      border-radius: 20px;
      background: #0d1a2f;
      border: 1px solid rgba(255,255,255,0.08);
    }
    video {
      width: 100%;
      display: block;
      border-radius: 20px 20px 0 0;
      background: #000;
    }
    .card-title {
      padding: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      background: rgba(255,255,255,0.04);
    }
    .empty {
      padding: 32px;
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
      margin-top: 24px;
      background: rgba(255,255,255,0.03);
    }
    @media (max-width: 680px) {
      .topbar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Member Video Gallery</h1>
        <p>Only signed-in members can watch these uploaded videos. Access the latest uploaded content here.</p>
      </div>
      <div class="button-row">
        <a href="/" class="button secondary">Home</a>
        <a href="login.html" class="button primary">Log Out</a>
      </div>
    </div>
    <div id="videos"></div>
  </div>

  <script>
    async function loadVideos() {
      const container = document.getElementById('videos');
      try {
        const response = await fetch('/api/member-videos');
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.message || 'Unable to load videos.');

        if (!data.videos || data.videos.length === 0) {
          container.innerHTML = '<div class="empty">No videos are available yet.</div>';
          return;
        }

        container.innerHTML = '<div class="grid">' + data.videos.map(video => `
          <div class="card">
            <video controls preload="metadata" src="${video.url}"></video>
            <p>${video.name}</p>
          </div>
        `).join('') + '</div>';
      } catch (error) {
        container.innerHTML = '<div class="empty">' + (error.message || 'Unable to load videos.') + '</div>';
      }
    }

    loadVideos();
  </script>
</body>
</html>
