<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color-scheme: light;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #e87c2a;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #182238 0%, #0d1727 45%, #08101f 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(14, 25, 42, 0.12);
      border-radius: 24px;
      padding: 36px 34px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.14);
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      margin: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(232,124,42,0.1), transparent 55%);
    }
    h1 { margin: 0 0 12px; font-size: 2rem; letter-spacing: -0.04em; }
    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.97rem;
    }
    form { display: flex; flex-direction: column; gap: 14px; }
    input {
      padding: 14px 16px;
      border: 1px solid rgba(224, 226, 230, 0.9);
      border-radius: 14px;
      font-size: 1rem;
      background: #fff;
      color: #111827;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input:focus {
      border-color: rgba(232, 124, 42, 0.85);
      box-shadow: 0 0 0 4px rgba(232, 124, 42, 0.12);
    }
    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), #f2a659);
      color: white;
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 14px 32px rgba(232,124,42,0.24);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(232,124,42,0.3);
    }
    .message { margin-top: 10px; font-size: 0.95rem; color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Secure Access Portal</h1>
    <p class="subtitle">Sign in to access member videos or the admin dashboard. Your credentials are required to proceed.</p>
    <form id="loginForm">
      <input type="text" id="username" name="username" placeholder="Username" required />
      <input type="password" id="password" name="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const payload = { username, password };

      message.style.color = '#b91c1c';
      message.textContent = 'Authenticating...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const result = await response.json();
          if (result.role === 'member') {
            localStorage.setItem('memberAuth', 'true');
            window.location.href = 'member.html';
          } else {
            localStorage.setItem('adminAuth', 'true');
            window.location.href = 'admin.html';
          }
          return;
        }
      } catch (err) {
        // Backend API not reachable (Pure S3 Static Hosting Mode)
        console.log('[S3 Static Auth Mode]');
      }

      // Pure S3 Static Hosting fallback check
      if (username === 'admin' && password === 'admin123') {
        localStorage.setItem('adminAuth', 'true');
        message.style.color = '#15803d';
        message.textContent = 'Login successful! Redirecting to Admin Dashboard...';
        setTimeout(() => { window.location.href = 'admin.html'; }, 500);
      } else if (username === 'member' && password === 'member123') {
        localStorage.setItem('memberAuth', 'true');
        message.style.color = '#15803d';
        message.textContent = 'Login successful! Redirecting to Member Gallery...';
        setTimeout(() => { window.location.href = 'member.html'; }, 500);
      } else {
        message.style.color = '#b91c1c';
        message.textContent = 'Invalid username or password.';
      }
    });
  </script>
</body>
</html>
