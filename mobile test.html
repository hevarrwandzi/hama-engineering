<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Dilshad K. Jaf Engineering Consultancy Bureau</title>
<meta name="description" content="Professional engineering consultancy services in civil, structural, electrical, mechanical, HVAC, and architectural fields in Kurdistan, Iraq.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg-color: #f4f6f9; --text-color: #333; --header-bg: #1f2f46;
  --nav-bg: #ff7300; --card-bg: #ffffff; --team-card-bg: #ff7300;
  --footer-bg: #1f2f46; --section-h2: #1f2f46; --border: #ddd;
}
[data-theme="dark"] {
  --bg-color: #0f172a; --text-color: #f1f5f9; --header-bg: #1e293b;
  --nav-bg: #e66a00; --card-bg: #1e293b; --team-card-bg: #1e293b;
  --footer-bg: #1e293b; --section-h2: #ff7300; --border: #334155;
}
html { scroll-behavior: smooth; }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--bg-color);color:var(--text-color);transition: background 0.3s, color 0.3s; overflow-x: hidden;}

/* ===== HEADER ===== */
header{background:var(--header-bg);color:white;padding:20px;}
.header-container{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  max-width:1200px;
  margin:auto;
  gap:10px;
}
.logo img{height:60px;}
.title{text-align:center;flex:1;min-width:200px;margin:10px 0;}
.title h1{font-size:24px;}
.location{font-size:13px;text-align:right;min-width:200px;}
nav{background:var(--nav-bg);text-align:center;padding:10px;position:sticky;top:0;z-index:100;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;transition: background 0.3s;}
nav a{color:white;margin:5px 10px;font-weight:600;text-decoration:none;font-size:14px;}
nav a:hover{color:#ffdeab;}
#theme-toggle { background: rgba(255, 255, 255, 0.2); border: 1px solid white; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
#theme-toggle:hover { background: white; color: var(--nav-bg); }

/* ===== HERO ===== */
.hero-section { background: var(--header-bg); padding: 40px 20px; text-align: center; color: white; }
.video-container { max-width: 900px; margin: 0 auto 30px auto; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #000; line-height: 0; }
.video-container video { width: 100%; height: auto; display: block; }
.hero-content h2 { font-size: 32px; margin-bottom: 15px; color: white; }
.hero-content p { font-size: 1.1rem; margin-bottom: 25px; opacity: 0.9; }
.btn { background: #ff9800; color: white; padding: 12px 30px; border-radius: 25px; text-decoration: none; font-weight: 600; display: inline-block; }
.btn:hover { background: #e68900; }

/* ===== SECTIONS ===== */
section{padding:60px 20px;max-width:1200px;margin:auto;scroll-margin-top: 80px;}
section h2{text-align:center;margin-bottom:40px;font-size:28px;color:var(--section-h2);}
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
.service-box{ background:var(--card-bg); padding:30px; border-radius:12px; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,0.05); transition:0.3s ease; cursor:pointer; text-decoration:none; color:var(--text-color); border: 1px solid var(--border); }
.service-box:hover{ transform:translateY(-5px); box-shadow:0 10px 25px rgba(0,0,0,0.1); border-color: var(--nav-bg); }
.about p{max-width:800px;margin:auto;text-align:center;line-height:1.8;font-size:16px;}

/* ===== TEAM ===== */
.team-members { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
.team-card { display: flex; flex-direction: column; align-items: center; background-color: var(--team-card-bg); border-radius: 15px; overflow: hidden; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); transition: 0.3s; text-decoration: none; color: white; }
[data-theme="dark"] .team-card { border: 1px solid #334155; color: var(--text-color); background-color: var(--card-bg); }
.team-card:hover { transform: translateY(-10px); }
.team-image { width: 100%; height: 350px; background-size: cover; background-position: center; }
.team-info { padding: 20px; text-align: center; }
.team-info h3 { font-size: 18px; margin-bottom: 5px; }
.team-info p { font-size: 14px; opacity: 0.9; }
.team-card.top-card { grid-column: 1 / -1; max-width: 800px; margin: 0 auto 30px auto; transform: scale(1.05); border: 3px solid #ff7300; }

/* ===== CONTACT ===== */
.contact form{max-width:600px;margin:auto;display:flex;flex-direction:column;gap:15px;}
.contact input,.contact textarea{padding:14px;border-radius:8px;border:1px solid #ddd; background: var(--card-bg); color: var(--text-color); width: 100%; font-family: inherit;}
.contact button{padding:14px;background:#ff9800;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer; font-size: 16px;}
.contact button:hover{background:#e68900;}

/* ===== FOOTER ===== */
footer{background:var(--footer-bg);color:white;text-align:center;padding:30px 20px;margin-top:40px;}

/* ===== WHATSAPP ===== */
.whatsapp {position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; font-size: 28px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 50%; text-decoration: none; box-shadow: 0 8px 20px rgba(0,0,0,0.25); transition: all 0.3s ease; z-index: 1000;}
.whatsapp:hover { transform: scale(1.15); background: #1ebe5d; }

/* ===== BACK TO TOP ===== */
#back-to-top { position: fixed; bottom: 90px; left: 20px; background: #ff9800; color: white; padding: 12px 18px; border-radius: 25px; font-size: 18px; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; z-index: 1000; transition: opacity 0.4s, transform 0.3s, background 0.3s, visibility 0.4s; }
#back-to-top.show { opacity: 1; visibility: visible; }
#back-to-top:hover { background: #e68900; transform: scale(1.1); }

/* ===== PARTNERS ===== */
.partners-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 20px; justify-items: center; align-items: center; }
.partner-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; transition: 0.3s; padding: 15px; cursor: pointer; }
.partner-card img { width: 120px; height: 80px; object-fit: contain; margin-bottom: 10px; }
.partner-card h3 { margin: 5px 0; font-size: 16px; color: var(--text-color); }
.partner-card p { font-size: 14px; opacity: 0.8; color: var(--text-color); }
.partner-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 768px) {
  .header-container { flex-wrap: wrap; justify-content: center; text-align: center; gap: 10px; }
  .location { text-align: center; margin-top: 10px; }
  nav { justify-content: center; gap: 5px; }
  nav a, nav button { font-size: 13px; margin: 3px 5px; }
  .services { grid-template-columns: 1fr; }
  .team-members { grid-template-columns: 1fr; max-width: 400px; margin: auto; }
  .partners-grid { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 480px) {
  .logo img { height: 50px; }
  .title h1 { font-size: 18px; }
  .title p { font-size: 12px; }
  .location { font-size: 12px; }
  nav a, nav button { font-size: 12px; margin: 2px 3px; }
  .partners-grid { grid-template-columns: 1fr; }
}

</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo"><img src="logo.png" alt="Logo"></div>
    <div class="title"><h1>Dr. Dilshad K. Jaf</h1><p>Engineering Consultancy Bureau</p></div>
    <div class="location">📍 Erbil – Kurdistan – Iraq<br>Raste.Qr - Bzhang Building</div>
  </div>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#services">Services</a>
  <a href="#about">About</a>
  <a href="#team">Team</a>
  <a href="#partners">Partners</a>
  <a href="#contact">Contact</a>
  <button id="theme-toggle"><i class="fas fa-moon"></i> Dark Mode</button>
</nav>

<!-- HERO, SERVICES, TEAM, PARTNERS, CONTACT, WHATSAPP, BACK TO TOP, FOOTER -->
<!-- Keep your existing sections here. They are already mobile-friendly with the updated CSS. -->

<script>
const backToTop = document.getElementById('back-to-top');

window.addEventListener('scroll', () => {
  if(window.scrollY > 300) {
    backToTop.classList.add('show');
  } else {
    backToTop.classList.remove('show');
  }
});

backToTop.addEventListener('click', () => {
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>

</body>
</html>
